name: Build AI Facebook Agent EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "FacebookAIAgent" --collect-all customtkinter --collect-all google.genai main.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FacebookAIAgent-Windows
          path: dist/FacebookAIAgent/
