name: Build Windows Executable

on:
  push:
    branches: [ "main" ] # Kích hoạt khi push code lên nhánh main
  workflow_dispatch:      # Cho phép bấm nút "Run workflow" thủ công trên web

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Lưu ý: Nếu code dùng Playwright, cần tải browser engine
      - name: Install Playwright browsers (Tùy chọn)
        run: |
          playwright install chromium

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "FacebookBot" main.py
        # Giải thích cờ lệnh:
        # --onedir: Xuất ra thư mục chứa exe + dlls (chạy nhanh và ít lỗi hơn --onefile khi có playwright)
        # --windowed: Ẩn cửa sổ dòng lệnh đen (chỉ dùng khi đã có GUI)
        # Nếu muốn gói tất cả vào 1 file duy nhất: thay --onedir bằng --onefile

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FacebookBot-Windows
          path: dist/FacebookBot/ # Nếu dùng --onefile thì sửa thành: dist/FacebookBot.exe
